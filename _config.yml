# Personal site, built by GitHub Pages (Jekyll with the built-in minima theme; no Actions needed).
# The custom domain is set in the repo's Pages settings, which also writes the CNAME file;
# GitHub Pages fills in site.url from it.
title: Ahmed Kamal
author: Ahmed Kamal
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from
github_username: 27medkamal
show_excerpts: true
# Posts live at /blog/<slug>/. The date stays in the file name and the front matter, and the topic
# goes in tags, so a URL survives re-dating and re-categorising. The root stays free for sections
# and project pages (/about/, /projects/, /<project-name>/). A moved URL keeps working through
# `redirect_from:` in the post's front matter.
permalink: /blog/:title/
